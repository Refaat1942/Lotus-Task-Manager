# OPTIONAL: serve Lotus Task Manager on port 80 (http://SERVER-IP/ instead of :5000).
# Not installed automatically, so other sites on this server are not affected.
#   apt install -y nginx
#   cp deploy/nginx-lotus.conf /etc/nginx/sites-available/lotus-taskmanager
#   ln -sf /etc/nginx/sites-available/lotus-taskmanager /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name 187.124.15.14;

    # Must be >= MAX_UPLOAD_MB in /etc/lotus-taskmanager.env (nginx default is only 1 MB)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
